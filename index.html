let current = 0;
let userAnswers = [];

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function showQuestion() {
  if (current >= questions.length) return showResults();

  const q = questions[current];
  const otherOptions = questions
    .filter((_, idx) => idx !== current)
    .map(q => q.correct);
  const shuffled = shuffle([
    q.correct,
    ...shuffle(otherOptions).slice(0, 3)
  ]);

  const quizContainer = document.getElementById('quiz');
  quizContainer.innerHTML = `
    <div class="question">Sual ${current + 1}: ${q.question}</div>
    ${shuffled.map(option => `
      <div class="option">${option}</div>
    `).join('')}
  `;

  const options = document.querySelectorAll('.option');
  options.forEach(opt => {
    opt.addEventListener('click', () => selectOption(opt, q.correct));
  });
}

function selectOption(element, correctCode) {
  const options = document.querySelectorAll('.option');
  options.forEach(opt => {
    if (opt.textContent.trim() === correctCode.trim()) {
      opt.classList.add('correct');
    } else if (opt === element) {
      opt.classList.add('wrong');
    }
    opt.style.pointerEvents = 'none'; // Disable clicking once option is selected
  });
  userAnswers.push(element.textContent.trim() === correctCode.trim());
  setTimeout(() => {
    current++;
    showQuestion();
  }, 1000);
}

function showResults() {
  const total = questions.length;
  let html = `<h2>Nəticə</h2>`;
  questions.forEach((q, i) => {
    html += `
      <div class="question">Sual ${i + 1}: ${q.question}</div>
      <div class="option ${userAnswers[i] ? 'correct' : 'wrong'}">
        ${q.correct}
      </div>
      <br/>
    `;
  });
  html += `<div class="result">Düzgün cavabların sayı: ${userAnswers.filter(Boolean).length} / ${total}</div>`;
  document.getElementById('quiz').innerHTML = html;
}

showQuestion();
</script>
